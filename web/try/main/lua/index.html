<!DOCTYPE html>
<html>
<head>
    <title>Lua - Browser</title>
    <style>
        body { font-family: monospace; margin: 20px; }
        #code {
            width: 80ch; height: 16em;
            font-family: monospace; font-size: 14px;
            tab-size: 4;
        }
        button {
            font-size: 14px; padding: 4px 16px;
            margin: 4px 4px 4px 0;
        }
        #runner {
            display: block; width: 80ch; height: 20em;
            border: 1px solid #ccc; background: #f8f8f8;
        }
    </style>
</head>
<body>
    <h3>Lua in the Browser</h3>
    <textarea id="code">print("hello")</textarea>
    <br>
    <button onclick="runner.src='run.html?t='+Date.now()+'#'+btoa(code.value)">Run</button>
    <iframe id="runner"></iframe>
</body>
</html>
